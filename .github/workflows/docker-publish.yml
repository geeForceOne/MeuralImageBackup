name: Publish Docker image

# Builds the container image and pushes it to GitHub Container Registry as
# ghcr.io/<owner>/meuralimagebackup and to Docker Hub under MeuralImageUploader's old name, so
# existing installations pulling :latest get the new version without changing anything. Then
# creates the GitHub release from that version's CHANGELOG.md section.
# Triggers: every `vX.Y.Z` tag, or manually via workflow_dispatch (images only, no release).
# Docker Hub needs the Actions secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

env:
  GHCR_IMAGE: meuralimagebackup
  # MeuralImageUploader's image on Docker Hub (Visual Studio's default from the project name).
  # Confirm it on Docker Hub before the first release.
  DOCKERHUB_IMAGE: geeforceone/meuralimageuploader

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR image names must be lowercase; repository_owner preserves the account's casing.
      - name: Compute image name
        run: echo "GHCR_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${GHCR_IMAGE}" >> "$GITHUB_ENV"

      # The version the app shows: the tag without its "v" (v2.0.0 -> 2.0.0), or the short commit
      # for a manual run without a tag, so every image can still be told apart.
      - name: Compute app version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.APP_VERSION }}

      # The release notes are this version's section of CHANGELOG.md ("## X.Y.Z - date" up to the
      # next "## ").
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="$APP_VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
